[package]
name = "rustkit-api"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tower-http = { version = "0.5", features = ["cors"] }
tracing = "0.1"
tracing-subscriber = "0.3"
qrcode = "0.14"
image = "0.25"
base64 = "0.22"
sha2 = "0.10"
md-5 = "0.10"
hex = "0.4"
urlencoding = "1.3"
reqwest = { version = "0.12", features = ["json"] }
jsonwebtoken = "9"